# Model Routing Configuration — Sovereign On-Premise Agentic AI Workbench
# -----------------------------------------------------------------------
# This file defines available model providers and routing rules.
# Phase 5: capabilities section added to each model for capability-based routing.

providers:
  ollama:
    type: ollama
    base_url: ${OLLAMA_BASE_URL}
    models:
      - qwen2.5:7b
      - llava:7b
    embedding_models:
      - nomic-embed-text

  # Uncomment to enable OpenAI-compatible provider
  # openai:
  #   type: openai_compatible
  #   base_url: ${OPENAI_BASE_URL}
  #   api_key: ${OPENAI_API_KEY}
  #   models:
  #     - gpt-4o
  #     - gpt-4o-mini

  # Uncomment to enable OpenRouter
  # openrouter:
  #   type: openai_compatible
  #   base_url: ${OPENROUTER_BASE_URL}
  #   api_key: ${OPENROUTER_API_KEY}
  #   models:
  #     - anthropic/claude-sonnet-4
  #     - meta-llama/llama-3-70b-instruct

# Default model used when none is specified
default_model: ollama/qwen2.5:7b

# Fallback chain — tried in order if the primary model fails
fallback_chain:
  - ollama/qwen2.5:7b
  - ollama/llava:7b

# Embedding model for RAG pipeline
embedding:
  provider: ollama
  model: nomic-embed-text

# Phase 5: Model capabilities for capability-based routing
# Each key is the full "provider/model" identifier
models:
  ollama/qwen2.5:7b:
    capabilities:
      - chat
    description: "General-purpose local reasoning model with strong instruction following"

  ollama/llava:7b:
    capabilities:
      - chat
      - vision
    description: "Multimodal vision + text model for image understanding"

  ollama/nomic-embed-text:
    capabilities:
      - embedding
    description: "Dense text embedding model powering the local RAG pipeline"

# Phase 5: Capability routing rules
# Defines which model to use for each capability
capability_routing:
  chat: ollama/qwen2.5:7b
  vision: ollama/llava:7b
  embedding: ollama/nomic-embed-text
